name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kompleto
          POSTGRES_PASSWORD: kompleto
          POSTGRES_DB: loopwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kompleto"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://kompleto:kompleto@localhost:5432/loopwright
      # Compile SQL checks from the committed .sqlx/ data; tests still run
      # against the real Postgres service.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-features --locked
      - name: The engine names no product
        run: |
          ! grep -rniE "kompleto|balanse|kotasyon|biyahe|iskedyul|resibo" src migrations

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
