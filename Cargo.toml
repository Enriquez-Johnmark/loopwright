[package]
name = "nudgewright"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-only"
description = "A durable engine for human-approved reminder loops: draft, approve, send exactly once, stop on reply, track"
repository = "https://github.com/Enriquez-Johnmark/nudgewright"
readme = "README.md"

[features]
# Test-only crash points for the send-exactly-once crash test; never enabled
# in production builds. Products forward it from their own `failpoints`.
failpoints = []

[dependencies]
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
hmac = "0.13.0"
mail-parser = "0.11.9"
reqwest = { version = "0.13.5", features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros", "parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "io-util", "fs", "net"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
needless_collect = "deny"
